name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new push hits the same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Env vars are read lazily at request time (not build time), so
    # dummy values are enough for next build to compile.
    env:
      AIRTABLE_TOKEN: ci-dummy
      AIRTABLE_BASE_ID: ci-dummy
      JWT_SECRET: ci-dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Next.js build
        run: npm run build

  a11y:
    name: A11y · axe-core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build

    # Public pages only (landing, login, signup, forgot-password) so no
    # Airtable test base needed. Runs on every push/PR to catch
    # regressions on the WCAG 2.1 AA baseline (cf. README "Accessibilité").
    env:
      AIRTABLE_TOKEN: ci-dummy
      AIRTABLE_BASE_ID: ci-dummy
      JWT_SECRET: ci-dummy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      - name: Run a11y tests (public pages)
        run: npx playwright test tests/e2e/a11y.spec.ts

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: playwright-report/
          retention-days: 7

  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    # Opt-in: E2E only runs when the repo variable E2E_ENABLED == 'true'.
    # That way pushes work without the test base configured. Toggle it
    # in repo Settings → Secrets and variables → Actions → Variables.
    if: ${{ vars.E2E_ENABLED == 'true' }}

    env:
      # GitHub Secrets to set: E2E_AIRTABLE_TOKEN, E2E_AIRTABLE_BASE_ID,
      # E2E_JWT_SECRET. See README §"Tests E2E en CI" for details.
      AIRTABLE_TOKEN: ${{ secrets.E2E_AIRTABLE_TOKEN }}
      AIRTABLE_BASE_ID: ${{ secrets.E2E_AIRTABLE_BASE_ID }}
      JWT_SECRET: ${{ secrets.E2E_JWT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build

      # Playwright config's webServer block starts `npm run start` and
      # waits for it to be ready. No manual server management needed.
      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
